name: external-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN_TEST || secrets.BOT_TOKEN }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Telegram Bot API (read-only)
        env:
          BOT_TOKEN: ${{ env.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ.get('BOT_TOKEN', '')
          if not token:
              raise SystemExit('Telegram secret is missing; expected TELEGRAM_BOT_TOKEN, BOT_TOKEN_TEST, or BOT_TOKEN')
          def call(method):
              url = 'https://api.telegram.org/bot' + token + '/' + method
              with urllib.request.urlopen(url, timeout=10) as r:
                  data = json.load(r)
              if not data.get('ok'):
                  raise SystemExit(f'{method}: API returned ok=false')
              return data['result']
          me = call('getMe')
          wh = call('getWebhookInfo')
          print('TELEGRAM_GETME_OK username=', me.get('username'), 'can_join_groups=', me.get('can_join_groups'))
          print('TELEGRAM_WEBHOOK_OK url_present=', bool(wh.get('url')), 'pending_updates=', wh.get('pending_update_count'))
          PY
      - name: Check GitHub API (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }} --jq '"GITHUB_REPO_API_OK repo=" + .full_name + " private=" + (.private|tostring)'
          gh api rate_limit --jq '"GITHUB_RATE_LIMIT_OK remaining=" + (.rate.remaining|tostring)'
